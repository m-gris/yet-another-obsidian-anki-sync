{{FrontSide}}

<div id="cs-hint">j / ↓ reveal next · k / ↑ hide last · 1-4 to grade</div>

<script>
// ANSWER SIDE: the items stay hidden and are revealed one at a time, which is the whole
// point of this note type — a list is one card on one schedule, so its order is enforced by
// the review rather than by hoping the scheduler serves separate cards in sequence.
//
// KEYS, AND WHY NOT ENTER. Anki registers its reviewer shortcuts above the web view, so a
// key Anki already uses never reaches the card: an earlier attempt to take Enter lost that
// race and revealed everything at once. j/k and the arrows are chosen because Anki leaves
// them free. Enter and 1-4 keep their usual meanings.
(function () {
  var items = Array.prototype.slice.call(document.querySelectorAll("#text li"));

  // REVEAL ORDER. `querySelectorAll` returns DOCUMENT order, and for a nested list document
  // order IS depth-first: each heading, then its own children, then the next heading. That is
  // what every card built before 2026-08-28 does and remains the default.
  //
  // BREADTH-FIRST IS THE SAME LIST SORTED BY NESTING DEPTH — every heading of one level before
  // any heading below it. Nothing about the DISPLAY changes: the list stays nested and looks
  // identical. Only the sequence the reveal key walks is different.
  //
  // THE DEPTH IS COUNTED FROM THE DOM, so no extra data has to be written into the card. A
  // stable sort keeps document order WITHIN each level, which is what makes the result
  // deterministic rather than merely breadth-first: `Array.prototype.sort` is required to be
  // stable in every engine Anki ships on.
  //
  // SELECTED BY THE `Reveal` FIELD BEING NON-EMPTY, via Anki's own conditional below. An empty
  // field means depth-first, which is why adding this field changed no existing card: every
  // note written before it existed has it empty.
  {{#Reveal}}
  var depthOf = function (li) {
    var d = 0;
    for (var n = li.parentNode; n && n.id !== "text"; n = n.parentNode)
      if (n.tagName === "UL" || n.tagName === "OL") d++;
    return d;
  };
  var order = {};
  items.forEach(function (li, i) { order[i] = i; li.setAttribute("data-doc", i); });
  items.sort(function (a, b) {
    var da = depthOf(a), db = depthOf(b);
    if (da !== db) return da - db;
    return Number(a.getAttribute("data-doc")) - Number(b.getAttribute("data-doc"));
  });
  {{/Reveal}}

  function firstHidden() {
    for (var i = 0; i < items.length; i++)
      if (items[i].classList.contains("hidden-cloze")) return items[i];
    return null;
  }
  function lastShown() {
    for (var i = items.length - 1; i >= 0; i--)
      if (!items[i].classList.contains("hidden-cloze")) return items[i];
    return null;
  }

  document.addEventListener("keydown", function (e) {
    var fwd  = (e.key === "j" || e.key === "ArrowDown");
    var back = (e.key === "k" || e.key === "ArrowUp");
    if (!fwd && !back) return;
    var target = fwd ? firstHidden() : lastShown();
    if (!target) return;
    target.classList.toggle("hidden-cloze");
    e.preventDefault();
    e.stopPropagation();
  }, true);

  document.getElementById("text").addEventListener("click", function (e) {
    if (e.target.classList && e.target.classList.contains("cloze"))
      e.target.classList.toggle("hidden-cloze");
  });
})();
</script>

<style>#text { opacity: 1 }</style>
