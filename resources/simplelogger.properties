# slf4j-simple's configuration. See the comment beside the dependency in `project.scala`.
#
# THIS FILE HAS TO SIT AT THE ROOT OF THE CLASSPATH, which `project.scala` otherwise argues
# against: slf4j-simple looks for exactly `simplelogger.properties` there and nowhere else, so
# unlike the note types it cannot be namespaced under a directory of its own. The shadowing risk
# that argument is about is real but small here — a dependency shipping its own copy would be
# unusual, and the consequence would be log verbosity rather than a card rendering someone else's
# markup.
#
# `error`, NOT `off`. This tool reports every refusal Anki makes through its own typed channel
# and prints it in its own words, so the logger is a second and unformatted channel that would
# only interleave with a report. But silencing it outright would also silence a failure nobody
# else is watching for. Measured on 2026-08-22: at DEBUG, a full sync against a live collection
# logged nothing at all on the healthy path, so this line costs no output in ordinary use.
org.slf4j.simpleLogger.defaultLogLevel=error
